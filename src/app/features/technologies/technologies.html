<div class="technologies-container reveal" #techSection>
  <canvas #techCanvas class="section-canvas"></canvas>

  <div class="tech-header reveal-scale">
    <div class="section-badge">
      <span class="badge-dot"></span>
      <span class="badge-text">{{ ts.t().TECH_BADGE }}</span>
    </div>
    <h2 class="section-title">
      <span class="gradient-text">{{ ts.t().TECH_TITLE }}</span>
    </h2>
  </div>

  <div class="orbital-system-container reveal">
    <div class="orbital-system" #orbitSystem [class.paused]="isHovering">
      <!-- Core Node -->
      <div class="core-node">
        <div class="core-pulse"></div>
        <div class="core-icon">&lt;/&gt;</div>
      </div>

      <!-- Orbit Rings -->
      <div class="orbit-ring orbit-ring-1"></div>
      <div class="orbit-ring orbit-ring-2"></div>
      <div class="orbit-ring orbit-ring-3"></div>

      <!-- Tech Nodes -->
      @for (t of tech; track t.name) {
        <div class="tech-node-wrapper orbit-{{t.orbit}}" 
             [style.--angle]="t.angle + 'deg'">
          <div class="tech-node-positioner">
            <div class="tech-node"
                 (mouseenter)="setHover(t.name)" 
                 (mouseleave)="setHover(null)"
                 [class.dimmed]="isHovering && hoveredTech !== t.name"
                 [class.highlighted]="hoveredTech === t.name">
              @switch (t.key) {
                @case ('elixir') {
                  <svg class="tech-svg" viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="#9b59b6" d="M12.2 2C9.5 5.4 6 10.1 6 14.3 6 18.7 9 22 12.6 22c3.2 0 5.4-2.3 5.4-5.5 0-2.8-1.8-5.4-3.3-7.6-.8-1.2-1.4-2.2-1.5-3.4-.1-1.1.1-2.2.5-3.1-.5-.1-1-.3-1.5-.4z"/>
                    <path fill="#c39bd3" opacity="0.7" d="M11.6 6.2C9.7 9 8.2 11.9 8.2 14.5c0 2.8 1.8 4.8 4.1 4.8 1.5 0 2.7-.8 3.2-2.1-1.3.7-3 .3-3.9-1-.9-1.3-.7-3.4.3-5.4-.1-1.5-.2-3-.3-4.6z"/>
                  </svg>
                }
                @case ('quarkus') {
                  <svg class="tech-svg" viewBox="0 0 24 24" aria-hidden="true">
                    <polygon fill="#4695eb" points="12,2 21,7 21,17 12,22 3,17 3,7" opacity="0.22"/>
                    <path fill="#4695eb" d="M12 2.5L20.5 7.4v9.2L12 21.5 3.5 16.6V7.4L12 2.5zm0 2.3L5.5 8.5v7l6.5 3.7 6.5-3.7v-7L12 4.8z"/>
                    <circle cx="9.2" cy="10.2" r="2.1" fill="#ff004a"/>
                    <circle cx="14.8" cy="10.2" r="2.1" fill="#4695eb"/>
                    <circle cx="12" cy="15.2" r="2.1" fill="#ffffff"/>
                  </svg>
                }
                @case ('postgresql') {
                  <svg class="tech-svg" viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="#336791" d="M17.2 4.4c-1.4-.9-3.2-.7-4.5.3-.5.4-.9.4-1.4 0-1.3-1-3.1-1.2-4.5-.3C4.8 5.7 4 8.5 4.8 11.3c.6 2 1.8 3.8 3.3 5.1.8.7 1.1 1.6 1 2.7 0 .8.5 1.5 1.3 1.7.8.2 1.6-.3 1.8-1.1l.4-1.8c.1-.5.6-.8 1.1-.6.8.2 1.6.1 2.3-.3.9-.6 1.5-1.6 1.6-2.8l.4 2.1c.2.8.9 1.3 1.7 1.1.8-.2 1.3-.9 1.1-1.7l-.6-3.3c.5-2.8-.6-6.2-3-7.8z"/>
                    <circle cx="9.3" cy="8.9" r="0.9" fill="#ffffff"/>
                    <circle cx="14.7" cy="8.9" r="0.9" fill="#ffffff"/>
                  </svg>
                }
                @case ('typescript') {
                  <svg class="tech-svg" viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="2.5" y="2.5" width="19" height="19" rx="3" fill="#3178c6"/>
                    <path fill="#ffffff" d="M6.5 11.2h5.2v1.6H9.9V19H8.1v-6.2H6.5v-1.6zm6.5 5.4c.5.4 1.3.7 2.1.7.9 0 1.4-.4 1.4-.9 0-.6-.4-.8-1.5-1.2-1.4-.5-2.2-1.2-2.2-2.4 0-1.4 1.2-2.4 3-2.4.9 0 1.7.2 2.2.5l-.4 1.5c-.4-.2-1-.5-1.8-.5s-1.2.4-1.2.8c0 .5.4.8 1.6 1.2 1.5.5 2.1 1.3 2.1 2.4 0 1.4-1.1 2.5-3.2 2.5-1 0-2-.3-2.5-.6l.4-1.6z"/>
                  </svg>
                }
                @default {
                  <i [class]="t.icon" [style.color]="t.color"></i>
                }
              }
              <span class="tech-tooltip">{{ t.name }}</span>
            </div>
          </div>
        </div>
      }
    </div>
  </div>

  <div class="tech-actions reveal">
    <a routerLink="/more-technologies" class="premium-button premium-button-secondary">
      <span class="button-content">
        {{ ts.t().MORE_TECH_BTN }}
        <i class="fas fa-arrow-right"></i>
      </span>
      <span class="button-glare"></span>
    </a>
  </div>
</div>
