<div class="contact-container reveal" #contactContainer>
  <canvas #contactCanvas class="section-canvas"></canvas>

  <div class="ambient-glow"></div>
  
  <div class="contact-header reveal-scale">
    <div class="section-badge">
      <span class="badge-dot"></span>
      <span class="badge-text">{{ ts.t().CONTACT_BADGE }}</span>
    </div>
    <h2 class="section-title">
      <span class="gradient-text">{{ ts.t().CONTACT_TITLE }}</span>
    </h2>
  </div>

  <div class="contact-content">
    <div class="social-grid">
      <!-- GitHub -->
      <div class="social-card-reveal reveal-left">
        <a href="https://github.com/EDK367" target="_blank" rel="noopener" class="social-card github-card">
          <div class="card-bg"></div>
          <div class="card-content-inner">
            <i class="fab fa-github social-icon"></i>
            <span class="social-name">GitHub</span>
            <span class="social-action">{{ ts.t().CONTACT_GITHUB_ACTION }} <i class="fas fa-arrow-right"></i></span>
          </div>
        </a>
      </div>

      <!-- LinkedIn -->
      <div class="social-card-reveal reveal-scale">
        <a href="https://www.linkedin.com/in/erikson-denilson-orozco-monterroso-498084324" target="_blank" rel="noopener" class="social-card linkedin-card">
          <div class="card-bg"></div>
          <div class="card-content-inner">
            <i class="fab fa-linkedin social-icon"></i>
            <span class="social-name">LinkedIn</span>
            <span class="social-action">{{ ts.t().CONTACT_LINKEDIN_ACTION }} <i class="fas fa-arrow-right"></i></span>
          </div>
        </a>
      </div>

      <!-- Email -->
      <div class="social-card-reveal reveal-right">
        <a href="mailto:denilmonterroso22@gmail.com" target="_blank" rel="noopener" class="social-card email-card">
          <div class="card-bg"></div>
          <div class="card-content-inner">
            <i class="fas fa-envelope social-icon"></i>
            <span class="social-name">Email</span>
            <span class="social-action">{{ ts.t().CONTACT_EMAIL_ACTION }} <i class="fas fa-arrow-right"></i></span>
          </div>
        </a>
      </div>
    </div>
  </div>
</div>
